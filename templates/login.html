{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Secure Login</h1>
    <form method="post" autocomplete="off">
        <label>Username
            <input name="username" maxlength="100" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button class="button" type="submit">Login</button>
    </form>
</div>
{% endblock %}
